version: '3'

networks:
  node:
    driver: bridge

services:
  nodejs:
    build:
      context: TCP
    ports:
      - "7070:7070/tcp"
    volumes:
      - ./TCP/data/:/app/data
    networks:
      - node
    working_dir: /app

  nginx:
    build:
      context: nginx
    ports:
      - "3030:3030/tcp"
    depends_on:
      - nodejs
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./ssl/certs/server.crt:/etc/ssl/server.crt
      - ./ssl/certs/server.key:/etc/ssl/server.key
      - ./ssl/certs/ca.crt:/etc/nginx/client_certs/ca.crt
    networks:
      - node